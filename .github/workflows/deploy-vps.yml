name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
            echo "Missing secret VPS_SSH_PRIVATE_KEY. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          HOST="${{ secrets.VPS_HOST }}"
          HOST="${HOST:-165.22.98.160}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host phamgia-vps
            HostName $HOST
            User ${{ secrets.VPS_USER || 'root' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF
          # Fix yaml empty secret fallback for user
          USER_SECRET="${{ secrets.VPS_USER }}"
          USER_NAME="${USER_SECRET:-root}"
          cat > ~/.ssh/config <<EOF
          Host phamgia-vps
            HostName $HOST
            User $USER_NAME
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude '*.zip' \
            ./ phamgia-vps:/var/www/pham-gia-app/

      - name: Install, build, restart
        run: |
          ssh phamgia-vps 'cd /var/www/pham-gia-app && npm install && npm run build && pm2 restart pham-gia && pm2 status pham-gia'

      - name: Health check
        run: |
          ssh phamgia-vps 'curl -sf http://127.0.0.1:3000/api/health || curl -sf http://127.0.0.1:3000/api/tables || true'
          echo "Deploy finished."
